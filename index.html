<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.svg">
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./style/standard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Palanquin:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body onload="render()">
    <header id="home">
      <section class="header-content">
        <div class="header_inner">
        <img
          src="./assets/icons/bestell_logo.svg"
          alt="BestellApp Logo"
          class="logo"
        />
        <nav>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </nav>
      </div>
      </section>
      <section class="header_intro">
      <img src="./assets/img/header.jpg" class="header" alt="Headerbild"/>
      <img src="./assets/icons/logo_burger.png" class="burgerhouse-icon" alt="Burgerhouse Logo"/>
    </section>
    </header>

    <main>
      <section class="rest_info wrapper">
        <div class="title_section">
          <h1><span class="orange">Burger</span>House</h1>
          <div class="reviews">
            <img src="./assets/icons/star.svg" class="star" alt="Icon Bewertung"/>
            <p><strong>4,1</strong> (317)</p>
          </div>
        </div>

        <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
      </section>
    
    </div>
<div class="content_wrapper">

 <section class="content">

  <div class="headline_section">
    <img src="./assets/icons/Chanese 1.svg" class="headline_icon" alt="Burger Icon"/>
    <h2>Burger & Sandwiches</h2>
    </div>
<section id="menu">
      </section>
      <div class="headline_section">
        <img src="./assets/icons/Pizza 1.svg" class="headline_icon" alt="Pizza Icon" />
        <h2>Pizza</h2></div>
        <section id="pizza_menu">
   
        </section>
      <div class="headline_section">
        <img src="./assets/icons/Salad 1.svg" class="headline_icon" alt="Salat Icon"/>
        <h2>Salad</h2></div>
        <section id="salad_menu">
   
    </section>
  </section> 
<section class="basket_wrapper closed_basket" id="basket_wrapper" class="">
 
  <section id="basket" >
    <h3>Your Basket</h3>
    <section class="basket_inner">
         <div id="item-basket"></div>
        </section>
        <h3>Subtotal: <span id="subtotal_number"></span></h3>
        <h3>Delivery Fee: <span class="orange">4,99€</span></h3>
         <h3 class="total">Total: <span class="total_number"></span></h3> 
         <button id="buy_items"  onclick="clearBasket()">Buy now <span class="total_number"></span></button>   
  </section>
  
  <dialog id="my_modal">
    <button class="close_dialog" onclick="closeDialog()">X</button>
    <img src="./assets/icons/delivery.png" class="truck" alt="Besttellung aufgegeben icon">
     <p><strong>Order confirmed!</strong><br>
     Your food is on the way!</p>
     </dialog>
</section>

</div><!-- Content Wrapper-->
  <footer>
      <p>&#169; 2025 BurgerHouse</p>
      <p>Imprint</p>
      <p>Cookie Preferences</p>
    </footer>
    </main>
  

    <section class="mobile-nav">

      <a href="#home"><img src="./assets/icons/home.svg" alt="Home Icon"></a>
      <img src="./assets/icons/person.svg" alt="Person Icon">
      <a href="#menu"><img src="./assets/icons/takeout_dining_2.svg" alt="takeout Icon"></a>
      <div class="mobile_basket_wrapper">
      <img src="./assets/icons/shopping_cart.svg" id="mobile_basket" alt="Warenkorb Icon" onclick="openBasket()" >
      <p id="item_counter_mobile">0</p>
      </div>
      

    </section>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/db.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
